# Render Blueprint — BizVyapar API + keep-alive cron
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bizvyapar-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WORKSHOP_AMOUNT_PAISE
        value: "100"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: bizvyapar
      - key: AUTH_JWT_SECRET
        sync: false
      # Fill these in Render Dashboard → Environment (or paste the block from chat)
      - key: CORS_ORIGIN
        sync: false
      - key: WEBINAR_LINK
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_SENDER_NAME
        value: BizVyapar
      - key: SMTP_FROM_NAME
        value: BizVyapar
      - key: ADMIN_DASHBOARD_NAME
        value: TredsDash
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false

  - type: cron
    name: bizvyapar-keepalive
    runtime: node
    rootDir: backend
    region: singapore
    plan: starter
    schedule: "* * * * *"
    buildCommand: npm install
    startCommand: node scripts/keepalive-once.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: KEEPALIVE_URL
        sync: false
